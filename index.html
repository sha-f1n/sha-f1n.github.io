
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080607">

<title>_shaf1n | Nyx_Vale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #8f263b;
    --red-light: #c04b60;
    --white: #e8e1e2;
    --muted: #a69a9d;
    --background: #080607;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--background);
    color: var(--white);
    font-family: 'Cormorant Garamond', Georgia, serif;
    cursor: crosshair;
}

/* Atmospheric gothic background */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(ellipse at 50% 20%,
        rgba(90, 35, 46, .20), transparent 45%),
        radial-gradient(ellipse at 12% 55%,
        rgba(45, 20, 27, .35), transparent 50%),
        radial-gradient(ellipse at 90% 75%,
        rgba(65, 18, 29, .20), transparent 45%),
        linear-gradient(180deg, #080708, #100a0d 65%, #050405);
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .35;
    background:
        radial-gradient(circle at 50% 5%,
        transparent 0 100px,
        rgba(160, 130, 135, .15) 102px,
        transparent 106px);
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .12;
    background-image:
        repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,.035) 4px
        );
    pointer-events: none;
}

/* Ambient red light */

.glow {
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(105, 15, 36, .10);
    filter: blur(110px);
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: -1;
    animation: pulse 8s ease-in-out infinite alternate;
}

@keyframes pulse {
    from { opacity: .4; transform: translate(-50%, -50%) scale(.8); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
}

/* Main profile */

main {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 55px 20px;
}

.profile {
    width: 100%;
    max-width: 650px;
    text-align: center;
    animation: entrance 1.5s ease both;
}

@keyframes entrance {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Avatar emblem */

.avatar {
    width: 145px;
    height: 145px;
    margin: 0 auto 22px;
    border: 1px solid var(--red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle, #28151b, #0b0809 72%);
    box-shadow: 0 0 35px rgba(126, 24, 48, .17);
    position: relative;
}

.avatar::before {
    content: "✦";
    color: var(--red-light);
    font-size: 62px;
    text-shadow: 0 0 25px rgba(180, 50, 75, .5);
}

.avatar::after {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid rgba(143, 38, 59, .3);
    border-radius: 50%;
}

/* Name */

h1 {
    font-family: 'UnifrakturMaguntia', Georgia, serif;
    font-size: clamp(48px, 9vw, 72px);
    font-weight: 400;
    letter-spacing: 1px;
    color: #eee7e8;
    text-shadow: 0 0 25px rgba(180, 130, 140, .12);
}

.username {
    margin-top: 2px;
    font-family: 'UnifrakturMaguntia', Georgia, serif;
    font-size: 27px;
    color: var(--red-light);
    letter-spacing: 2px;
}

/* Divider */

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 35px auto 25px;
    max-width: 320px;
    color: var(--red);
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red));
}

.divider::after {
    background: linear-gradient(90deg, var(--red), transparent);
}

.divider span {
    font-size: 22px;
}

/* Biography */

.bio {
    font-size: 20px;
    letter-spacing: 3px;
    color: #d2c5c8;
    font-style: italic;
    margin-bottom: 43px;
}

/* Social links */

.socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0;
}

.social {
    min-width: 125px;
    padding: 10px 17px;
    text-decoration: none;
    color: var(--white);
    border-right: 1px solid rgba(143, 38, 59, .35);
    transition: .35s ease;
}

.social:last-child {
    border-right: none;
}

.social:hover {
    color: var(--red-light);
    transform: translateY(-5px);
}

.social .symbol {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 27px;
    margin-bottom: 9px;
}

.social .label {
    display: block;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.social .detail {
    display: block;
    font-size: 14px;
    color: var(--muted);
    margin-top: 5px;
    letter-spacing: 1px;
}

/* Footer */

footer {
    margin-top: 48px;
    font-size: 11px;
    letter-spacing: 4px;
    color: #66545a;
    text-transform: uppercase;
}

footer span {
    color: var(--red);
}

/* Mobile */

@media (max-width: 520px) {
    main {
        padding: 35px 12px;
    }

    .avatar {
        width: 115px;
        height: 115px;
    }

    .social {
        min-width: 115px;
        margin-bottom: 20px;
    }

    .social:nth-child(2) {
        border-right: none;
    }

    .bio {
        font-size: 17px;
        letter-spacing: 2px;
    }
}

::selection {
    background: var(--red);
    color: white;
}
</style>
</head>

<body>

<div class="background"></div>

<main>
<section class="profile">

    <p class="bio">we have failed as humans.</p>

    <div class="socials">

        </a>

        <a class="social"
           href="https://discord.com/users/344499349612658688"
           target="_blank" rel="noopener noreferrer">
            <span class="symbol">◈</span>
            <span class="label">Discord</span>
            <span class="detail">344499349612658688</span>
        </a>

        <a class="social"
           href="https://www.instagram.com/_shaf1n/"
           target="_blank" rel="noopener noreferrer">
            <span class="symbol">◎</span>
            <span class="label">Instagram</span>
            <span class="detail">_shaf1n</span>
        </a>

        <a class="social"
           href="https://steamcommunity.com/id/_shafin/"
           target="_blank" rel="noopener noreferrer">
            <span class="symbol">◉</span>
            <span class="label">Steam</span>
            <span class="detail">_shafin</span>
        </a>

    </div>

    <div class="divider">
        <span>❖</span>
    </div>

    <footer>

</body>
</html>
