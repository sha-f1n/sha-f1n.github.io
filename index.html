
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Sanctuary</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080607;
    color: #eee5e5;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%,
      rgba(105, 12, 31, 0.23), transparent 65%);
    animation: breathe 6s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes breathe {
    from { opacity: .45; }
    to { opacity: 1; }
}

/* Profile card */
.card {
    position: relative;
    width: min(90%, 440px);
    padding: 48px 30px;
    text-align: center;
    background: rgba(19, 13, 15, .88);
    border: 1px solid rgba(151, 42, 62, .3);
    border-radius: 8px;
    box-shadow: 0 20px 80px rgba(0,0,0,.6);
    animation: appear 1.2s ease both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Avatar */
.avatar {
    width: 105px;
    height: 105px;
    margin: 0 auto 24px;
    border-radius: 50%;
    border: 2px solid #782437;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #210e14;
    color: #c36b7c;
    font-size: 36px;
    box-shadow: 0 0 30px rgba(132, 25, 52, .2);
}

h1 {
    font-size: 32px;
    font-weight: normal;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.tagline {
    color: #a47b83;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 25px;
}

.bio {
    color: #b9a9ad;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 30px;
}

.divider {
    width: 65px;
    height: 1px;
    background: #782437;
    margin: 0 auto 25px;
}

/* Social links */
.links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.links a {
    color: #d8b9c0;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 11px 17px;
    border: 1px solid #49202c;
    transition: .3s ease;
}

.links a:hover {
    color: white;
    background: #571b2b;
    border-color: #a33c56;
    box-shadow: 0 0 18px rgba(145, 30, 57, .25);
}

footer {
    margin-top: 35px;
    color: #66545a;
    font-size: 10px;
    letter-spacing: 2px;
    font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<main class="card">

    <div class="avatar">✦</div>

    <h1>YOUR NAME</h1>

    <p class="tagline">
        A DIGITAL SANCTUARY FOR THE INTELLECTUALLY RESTLESS.
    </p>

    <div class="divider"></div>

    <p class="bio">
        A mind wandering through fiction, knowledge,
        games and the obscure corners of existence.
        <br>
        Welcome to my little corner of the internet.
    </p>

    <div class="links">
        <a href="#" target="_blank">STEAM</a>
        <a href="#" target="_blank">DISCORD</a>
        <a href="#" target="_blank">GITHUB</a>
        <a href="#" target="_blank">INSTAGRAM</a>
    </div>

    <footer>
        EST. 2026 · OWNED BY ME
    </footer>

</main>

</body>
</html>
